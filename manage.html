<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>튼튼 영상 관리</title>
  <link rel="stylesheet" href="manage.css?v=5">
</head>
<body>
  <main class="shell">
    <header class="top-bar">
      <button id="pasteButton" class="icon-button add-button" aria-label="YouTube 영상 URL 붙여넣기" title="YouTube 영상 URL 붙여넣기">＋</button>
      <h1>튼튼 재생목록 관리</h1>
      <button id="authButton" class="icon-button auth-button" aria-label="Google로 로그인" title="Google로 로그인">●</button>
    </header>

    <section id="signedOut" class="empty-card">
      <span class="login-icon">person.crop.circle</span>
      <strong>먼저 Google로 로그인해 주세요.</strong>
      <span>튼튼 전용 재생목록은 로그인한 본인만 수정할 수 있습니다.</span>
    </section>

    <section id="manager" class="manager" hidden>
      <div class="tab-bar">
        <nav id="tabs" class="tabs" aria-label="영상 종류"></nav>
        <button id="addTabButton" class="small-icon-button" aria-label="탭 추가" title="탭 추가">＋</button>
        <button id="manageTabsButton" class="small-icon-button" aria-label="탭 관리" title="탭 관리">☰</button>
      </div>

      <p id="status" class="status" role="status"></p>
      <ol id="videoList" class="video-list"></ol>
      <div id="emptyList" class="empty-list">아직 등록된 영상이 없습니다.</div>
    </section>

    <dialog id="tabDialog" class="tab-dialog">
      <div class="dialog-header">
        <strong>탭 관리</strong>
        <button id="closeTabDialog" class="text-button">완료</button>
      </div>
      <ol id="tabList" class="tab-list"></ol>
      <p class="dialog-help">화살표로 순서를 바꾸고 연필로 이름을 변경할 수 있습니다.</p>
    </dialog>
  </main>

  <script type="module" src="manage.js?v=7"></script>
</body>
</html>
