<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>튼튼 영상 관리</title>
  <link rel="stylesheet" href="manage.css?v=3">
</head>
<body>
  <main class="shell">
    <header class="top-bar">
      <button id="pasteButton" class="icon-button add-button" aria-label="YouTube 영상 URL 붙여넣기" title="YouTube 영상 URL 붙여넣기">＋</button>
      <h1>튼튼 재생목록 관리</h1>
      <button id="authButton" class="icon-button auth-button" aria-label="Google로 로그인" title="Google로 로그인">●</button>
    </header>

    <section id="signedOut" class="empty-card">
      <span class="login-icon">person.crop.circle</span>
      <strong>먼저 Google로 로그인해 주세요.</strong>
      <span>튼튼 전용 재생목록은 로그인한 본인만 수정할 수 있습니다.</span>
    </section>

    <section id="manager" class="manager" hidden>
      <nav class="tabs" aria-label="영상 종류">
        <button class="tab active" data-category="songs">동요</button>
        <button class="tab" data-category="cars">자동차</button>
        <button class="tab" data-category="dinosaurs">공룡</button>
      </nav>

      <div class="sync-row">
        <span id="syncDot" class="sync-dot"></span>
        <span id="syncLabel">Firebase 연결 확인 중…</span>
      </div>

      <p id="status" class="status" role="status"></p>
      <ol id="videoList" class="video-list"></ol>
      <div id="emptyList" class="empty-list">아직 등록된 영상이 없습니다.</div>
    </section>
  </main>

  <script type="module" src="manage.js?v=5"></script>
</body>
</html>
